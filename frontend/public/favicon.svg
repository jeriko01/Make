<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e2b1a" />
      <stop offset="100%" stopColor="#0e0e0e" />
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#52fe7d" />
      <stop offset="50%" stopColor="#39A751" />
      <stop offset="100%" stopColor="#237c37" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a7f3d0" />
      <stop offset="100%" stopColor="#52fe7d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Theme Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#39A751" stroke-width="2" stroke-opacity="0.6" />

  <!-- Big Bold Modern M Monogram -->
  <path d="M16 46V24L26 34.5C29.5 38 34.5 38 38 34.5L48 24V46" 
        stroke="url(#mGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Small Code Icon < / > Integrated in Top -->
  <g filter="url(#glow)">
    <!-- < -->
    <path d="M22 17L17 21L22 25" stroke="url(#codeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- / -->
    <path d="M34 16L30 26" stroke="#52fe7d" stroke-width="2.2" stroke-linecap="round"/>
    <!-- > -->
    <path d="M42 17L47 21L42 25" stroke="url(#codeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Neon accent dot -->
  <circle cx="32" cy="46" r="2.5" fill="#52fe7d" />
</svg>
